<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM · Northlight Studio</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <meta name="description" content="Small CRM for Northlight Studio: leads, accounts, contacts, opportunities and support cases.">
  <style>
    :root {
      --bg: #0f1b2d; --panel: #16253b; --panel-2: #1c2f4a; --line: #2a4060;
      --text: #f4f1ea; --muted: #a9b6c7;
      --accent: #f5b942; --accent-ink: #1b1403;
      --gold: #d9b24c; --gold-soft: rgba(217, 178, 76, .14);
      --ok: #4ec9a0; --bad: #ff7a6b; --blue: #6fb7ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); line-height: 1.55; }
    a { color: var(--accent); }
    .wrap { max-width: 64rem; margin: 0 auto; padding: 0 1rem; }
    .bar { display: flex; justify-content: space-between; align-items: center; padding: 1rem 0; border-bottom: 1px solid var(--line); }
    .brand { font-weight: 700; color: var(--text); text-decoration: none; }
    .brand span { color: var(--gold); }
    .bar nav { display: flex; gap: 1rem; }

    h1 { font-size: 2rem; margin: 1.5rem 0 .25rem; }
    h1::after { content: ""; display: block; width: 3.5rem; height: 3px; margin-top: .5rem; background: linear-gradient(90deg, var(--gold), transparent); }
    h2 { font-size: 1.25rem; margin: 0 0 .75rem; }
    .lead { color: var(--muted); margin: .5rem 0 1.25rem; }
    .meta { color: var(--muted); font-size: .85rem; }

    .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: .75rem; margin-bottom: 1rem; }
    @media (max-width: 44rem) { .tiles { grid-template-columns: repeat(2, 1fr); } }
    .tile { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--gold); border-radius: 10px; padding: .8rem 1rem; }
    .tile .n { font-size: 1.6rem; font-weight: 800; line-height: 1.2; }
    .tile .l { color: var(--muted); font-size: .85rem; }

    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 1.25rem; margin-bottom: 1rem; }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: .5rem; }
    .card-head h2 { margin: 0; }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .seg button { border: 0; border-radius: 0; background: transparent; }
    .seg button[aria-pressed="true"] { background: var(--gold-soft); color: var(--gold); font-weight: 700; }

    svg { display: block; width: 100%; height: auto; }
    svg text { fill: var(--muted); font-family: inherit; }
    svg .val { fill: var(--text); font-weight: 700; }
    svg .grid { stroke: var(--line); stroke-width: 1; }
    svg .axis { stroke: var(--gold); stroke-width: 1.5; }

    .tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--line); margin-bottom: 1rem; overflow-x: auto; }
    .tab { border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: .55rem 1rem; background: transparent; color: var(--text); white-space: nowrap; }
    .tab[aria-current="true"] { border-bottom-color: var(--gold); color: var(--gold); font-weight: 700; }
    .tab .c { color: var(--muted); font-weight: 400; margin-left: .25rem; }

    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    input, select { padding: .55rem .7rem; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; width: 100%; }
    input:focus, select:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: .25rem; }
    .btn { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: .4rem .9rem; }
    .btn:hover:not(:disabled) { border-color: var(--gold); }
    .btn:disabled { opacity: .4; cursor: default; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
    .btn.gold { border-color: var(--gold); color: var(--gold); font-weight: 600; }
    .btn.gold:hover:not(:disabled) { background: var(--gold-soft); }
    .btn.small { padding: .2rem .65rem; font-size: .85rem; }

    form.inline { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: .75rem; align-items: end; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: .9rem; margin-bottom: 1rem; }

    .tablewrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: .95rem; }
    th, td { text-align: left; padding: .55rem .6rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
    th { color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr.done td { opacity: .55; }
    td select { width: auto; padding: .25rem .5rem; }

    .badge { display: inline-block; font-size: .72rem; font-weight: 800; padding: .1rem .55rem; border-radius: 999px; color: #0b1422; white-space: nowrap; }
    .st-Lead { background: #8fa8c8; } .st-Qualified { background: var(--blue); } .st-Quote { background: var(--ok); }
    .st-Won { background: var(--gold); } .st-Lost { background: var(--bad); }
    .pr-High { background: var(--bad); } .pr-Medium { background: var(--accent); } .pr-Low { background: var(--blue); }
    .b-new { background: var(--accent); } .b-conv { background: var(--ok); } .b-closed { background: #8fa8c8; }
    .overdue { background: var(--bad); color: #2a0a06; font-weight: 800; font-size: .7rem; letter-spacing: .04em; text-transform: uppercase; padding: .1rem .5rem; border-radius: 4px; margin-left: .35rem; }
    .late { color: var(--bad); font-weight: 600; }
    .empty { color: var(--muted); padding: .75rem 0; }

    #toast { position: fixed; bottom: 1rem; left: 50%; transform: translateX(-50%); background: var(--ok); color: #04261b; padding: .6rem 1rem; border-radius: 8px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; }
    #toast.show { opacity: 1; }
    footer { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: .85rem; padding: .5rem 0 2rem; }
  </style>
  <link rel="stylesheet" href="site.css">
</head>
<body class="sx" data-page="crm" style="--sx-max:64rem">
  <a class="sx-skip" href="#sx-main">Skip to content</a>
  <header class="sx-header">
    <div class="sx-wrap">
      <a class="sx-brand" href="index.html"><img src="logo.svg" width="34" height="34" alt="Northlight Studio logo"><span>Northlight <b>Studio</b></span></a>
      <button class="sx-toggle" id="sx-toggle" type="button" aria-expanded="false" aria-controls="sx-nav" aria-label="Menu"><span></span></button>
      <nav class="sx-nav" id="sx-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="helpdesk.html">Help desk</a></li>
          <li><a href="crm.html" aria-current="page">CRM</a></li>
          <li><a href="troubleshoot.html">PC &amp; network tools</a></li>
          <li><a href="staff.html">Staff access</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="sx-banner" aria-labelledby="sx-h1">
    <div class="sx-stars" aria-hidden="true"></div>
    <canvas class="sx-aurora" data-palette="crm" aria-hidden="true"></canvas>
    <svg class="sx-art" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
      <line x1="14" y1="172" x2="186" y2="172" stroke="#d9b24c" stroke-width="2" stroke-linecap="round"/>
      <rect class="sx-funnel" style="animation-delay:0s" x="22" y="62" width="26" height="110" rx="4" fill="#8fa8c8"/>
      <rect class="sx-funnel" style="animation-delay:-.7s" x="54" y="87" width="26" height="85" rx="4" fill="#6fb7ff"/>
      <rect class="sx-funnel" style="animation-delay:-1.4s" x="86" y="110" width="26" height="62" rx="4" fill="#4ec9a0"/>
      <rect class="sx-funnel" style="animation-delay:-2.1s" x="118" y="132" width="26" height="40" rx="4" fill="#d9b24c"/>
      <rect class="sx-funnel" style="animation-delay:-2.8s" x="150" y="148" width="26" height="24" rx="4" fill="#ff7a6b"/>
    </svg>
    <div class="sx-wrap sx-banner-inner">
      <p class="sx-eyebrow">Sales &amp; service</p>
      <h1 id="sx-h1">CRM</h1>
      <p class="sx-lead">Leads, accounts, contacts, opportunities and support cases in one place.</p>
    </div>
  </section>

  <div class="wrap" id="sx-main" style="padding-top:1.5rem">
    <div id="tiles" class="tiles sx-rise"></div>

    <section class="card sx-rise" style="--d:.08s" aria-labelledby="chart-h" data-win="pipeline.chart" data-tone="gold" data-skin="neon">
      <div class="card-head">
        <h2 id="chart-h">Opportunities by stage</h2>
        <div class="seg" role="group" aria-label="Chart measure">
          <button id="m-count" class="btn" type="button" aria-pressed="true">Count</button>
          <button id="m-value" class="btn" type="button" aria-pressed="false">Value</button>
        </div>
      </div>
      <div id="chart"></div>
    </section>

    <section class="card sx-rise" style="--d:.16s" data-win="records" data-tone="blue" data-skin="notch">
      <div id="tabs" class="tabs"></div>
      <div id="panel"></div>
    </section>

    <footer>
      <button id="reset" class="btn small" type="button">Reset demo data</button>
      <span>Demo only: fake data, saved just in this browser (localStorage).</span>
    </footer>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="crm.js"></script>
  <script src="site.js"></script>
</body>
</html>
