<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northlight Studio</title>
  <meta name="description" content="Northlight Studio is a 25-person design studio.">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f1b2d;
      color: #f4f1ea;
    }
    main { max-width: 36rem; padding: 2rem 1rem; }
    h1 { font-size: 2.5rem; margin: 0 0 1rem; }
    p { font-size: 1.125rem; line-height: 1.6; margin: 0; color: #c9d1dc; }
    .cta {
      display: inline-block; margin-top: 1.5rem; padding: .7rem 1.2rem;
      background: #f5b942; color: #1b1403; font-weight: 700;
      border-radius: 8px; text-decoration: none;
    }
    .cta:hover { filter: brightness(1.08); }
    .cta.alt {
      background: transparent; color: #f4f1ea;
      border: 1px solid #d9b24c; margin-left: .5rem;
    }
    .cta.alt:hover { background: rgba(217, 178, 76, .12); filter: none; }
  </style>
</head>
<body>
  <main>
    <h1>Northlight Studio</h1>
    <p>We are a 25-person design studio. We help teams turn ideas into clear, well-crafted brands, products and experiences.</p>
    <a class="cta" href="helpdesk.html">Visit the help desk</a>
    <a class="cta alt" href="crm.html">Open the CRM</a>
  </main>
</body>
</html>
