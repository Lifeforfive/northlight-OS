name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: the job can read the code, and publish to Pages. Nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Every action is pinned to a full commit hash (the tag is in the comment), so a tag that is
      # moved later cannot change what runs here. Dependabot (.github/dependabot.yml) proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # The checks below must pass before anything is deployed.
      # If one fails, the job stops there and the site is NOT published.
      - name: Check the cloud description (names and tags)
        run: node tools/check-cloud.js

      - name: Check health.json and stamp today's build date
        run: node tools/stamp-health.js --stamp

      - name: Assemble the site (only the files it needs; no tests, tooling or README)
        run: node tools/build-site.js _site

      - name: Check links, run-time files and security rules (CSP, no inline code)
        run: node tools/check-links.js _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
