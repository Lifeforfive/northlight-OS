name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The two checks below must pass before anything is deployed.
      # If one fails, the job stops here and the site is NOT published.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check the cloud description (names and tags)
        run: node tools/check-cloud.js

      - name: Check health.json and stamp today's build date
        run: node tools/stamp-health.js --stamp

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
